```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            background:
                radial-gradient(circle at top left, #00f2fe, transparent 35%),
                radial-gradient(circle at bottom right, #7b2cff, transparent 35%),
                linear-gradient(135deg, #050816, #101936);
        }

        .success-card {
            width: 100%;
            max-width: 600px;

            padding: 50px 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.10);

            border: 1px solid rgba(255, 255, 255, 0.25);

            border-radius: 25px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45),
                inset 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .check {
            width: 80px;
            height: 80px;

            margin: 0 auto 25px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            font-size: 42px;

            color: white;

            background: linear-gradient(
                135deg,
                #00c853,
                #00e676
            );

            box-shadow:
                0 0 30px rgba(0, 230, 118, 0.5);
        }

        h1 {
            font-size: 32px;

            margin-bottom: 15px;

            color: white;
        }

        .message {
            color: #cbd5e1;

            font-size: 16px;

            margin-bottom: 30px;
        }

        .home-button {
            display: inline-block;

            padding: 14px 30px;

            border-radius: 12px;

            text-decoration: none;

            color: white;

            font-size: 16px;

            font-weight: bold;

            background: linear-gradient(
                135deg,
                #00c6ff,
                #0072ff
            );

            box-shadow:
                0 8px 25px rgba(0, 114, 255, 0.35);

            transition: 0.3s;
        }

        .home-button:hover {
            transform: translateY(-4px);

            box-shadow:
                0 12px 35px rgba(0, 242, 254, 0.5);
        }

        @media (max-width: 500px) {

            .success-card {
                padding: 40px 20px;
            }

            h1 {
                font-size: 26px;
            }

            .check {
                width: 70px;
                height: 70px;

                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <div class="success-card">

        <div class="check">
            ✓
        </div>

        <h1>
            Your Registration Is Done!
        </h1>

        <p class="message">
            Student registration has been successfully completed.
        </p>

        <a href="{% url 'home' %}" class="home-button">
            Go To Home Page
        </a>

    </div>

</body>
</html>
```
