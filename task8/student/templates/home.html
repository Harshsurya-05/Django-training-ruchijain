```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #00f2fe, transparent 35%),
                radial-gradient(circle at bottom right, #7b2cff, transparent 35%),
                linear-gradient(135deg, #050816, #101936);

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 600px;

            padding: 45px;

            text-align: center;

            background: rgba(255, 255, 255, 0.10);

            border: 1px solid rgba(255, 255, 255, 0.25);

            border-radius: 25px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45),
                inset 0 0 20px rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 40px;

            background: linear-gradient(
                90deg,
                #00f2fe,
                #4facfe,
                #a855f7
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 20px;

            flex-wrap: wrap;
        }

        form {
            margin: 0;
        }

        input[type="submit"] {
            width: 180px;

            padding: 15px 20px;

            border: none;
            border-radius: 12px;

            font-size: 17px;
            font-weight: bold;

            color: white;

            cursor: pointer;

            transition: all 0.3s ease;

            background: linear-gradient(
                135deg,
                #00c6ff,
                #0072ff
            );

            box-shadow: 0 8px 25px rgba(0, 114, 255, 0.35);
        }

        input[type="submit"]:hover {
            transform: translateY(-5px) scale(1.03);

            box-shadow:
                0 12px 35px rgba(0, 242, 254, 0.5);
        }

        form:nth-child(2) input[type="submit"] {
            background: linear-gradient(
                135deg,
                #a855f7,
                #ec4899
            );

            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.35);
        }

        form:nth-child(2) input[type="submit"]:hover {
            box-shadow:
                0 12px 35px rgba(236, 72, 153, 0.5);
        }

        @media (max-width: 600px) {

            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 32px;
                margin-bottom: 30px;
            }

            .button-container {
                flex-direction: column;
            }

            input[type="submit"] {
                width: 260px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>
            This Is Home Page
        </h1>

        <div class="button-container">

            <form action="{% url 'login' %}" method="post">
                {% csrf_token %}

                <input type="submit" value="Login">
            </form>

            <form action="{% url 'signup' %}" method="post">
                {% csrf_token %}

                <input type="submit" value="Signup">
            </form>

        </div>

    </div>

</body>
</html>
```
